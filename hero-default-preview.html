<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vickey Lu — Hero Static Preview</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f6f5f1; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe src="./index.html#top" title="Vickey Lu Hero with proposed static background"></iframe>
  <script>
    const frame = document.querySelector('iframe');
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      const style = doc.createElement('style');
      style.textContent = `
        html, body { overflow: hidden !important; }
        .hero { height: 100vh !important; min-height: 0 !important; max-height: none !important; }
        .hero-atmosphere {
          background: #f6f5f1 url('./assets/hero-default-preview-v2.png') center center / cover no-repeat !important;
          filter: saturate(1.2) contrast(1.06);
        }
        .hero-atmosphere canvas { display: none !important; }
        .hero-cursor {
          opacity: 1 !important;
          transform: translate3d(calc(100vw - 360px), 315px, 0) !important;
        }
      `;
      doc.head.append(style);
      frame.contentWindow.scrollTo(0, 0);
    });
  </script>
</body>
</html>
