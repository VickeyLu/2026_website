<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="robots" content="noindex">
  <title>Vickey Lu — Product Designer</title>
  <meta name="description" content="Vickey Lu — product designer for AI and platform systems.">
  <meta property="og:title" content="Vickey Lu — Product Designer">
  <meta property="og:description" content="See systems. Understand people. Ship clarity.">
  <meta property="og:image" content="og.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="poster.webp">
  <style>
    :root { --ink: #ffffff; --muted: #b4bccb; --space: #05070b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--space); }
    body { font-family: Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }

    .hero { position: relative; width: 100vw; height: 100vh; height: 100svh; overflow: hidden; background: var(--space); }
    .wrap { position: absolute; left: 0; top: 0; }
    .wrap video, .wrap img.poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    .fx .rim { fill: none; stroke: url(#dawng); opacity: 0; }
    .fx.play .rim { animation: halo 4s .3s ease-in-out forwards; }
    @keyframes halo { 0% { opacity: 0 } 45% { opacity: .22 } 100% { opacity: 0 } }

    .night { position: absolute; inset: 0; pointer-events: none; opacity: 1;
      background: radial-gradient(ellipse 75% 95% at 4% 70%, rgba(3,5,10,.2), rgba(3,5,10,.72) 72%); }
    .night.play { animation: dawn 3.5s .15s cubic-bezier(.35,0,.2,1) forwards; }
    .night.static { opacity: 0; }
    @keyframes dawn { to { opacity: 0 } }

    .copy { position: absolute; left: clamp(24px, 6vw, 112px); top: 50%; transform: translateY(-62%); max-width: 46vw; }
    .copy p { margin: 0 0 1.4em; font-size: clamp(13px, 1.05vw, 16px); color: var(--muted); letter-spacing: .005em; }
    .copy h1 { margin: 0; font-weight: 400; font-size: clamp(40px, 4.6vw, 76px); line-height: 1.08; letter-spacing: -.015em; }
    .copy h1 span { display: block; }

    @media (max-width: 760px) and (orientation: portrait) {
      .copy { top: max(64px, 11svh); transform: none; max-width: 78vw; }
      .copy h1 { font-size: clamp(30px, 8.8vw, 40px); }
      .copy p { font-size: 13px; margin-bottom: 1.1em; }
    }
  </style>
</head>
<body>
  <main class="hero" aria-labelledby="hero-heading">
    <div class="wrap" id="wrap" aria-hidden="true">
      <video id="vid" src="swing-loop.mp4" poster="poster.webp" muted loop playsinline autoplay preload="auto"></video>
      <svg class="fx" id="fx" viewBox="0 0 1672 941" preserveAspectRatio="none">
        <defs>
          <filter id="b6" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
          <filter id="b2" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="20"/></filter>
          <linearGradient id="dawng" gradientUnits="userSpaceOnUse" x1="-125" y1="0" x2="1550" y2="0">
            <stop offset="0" stop-color="#e9d3b6"/><stop offset=".28" stop-color="#e8e2d8"/><stop offset=".6" stop-color="#d4e6ff"/><stop offset="1" stop-color="#b9d4f5"/>
          </linearGradient>
        </defs>
        <g transform="translate(125 150)">
          <path class="rim" d="M-125 408 C200 398,450 403,600 420 S900 462,1100 501 L1550 598" stroke-width="10" filter="url(#b6)"/>
          <path class="rim" d="M-125 408 C200 398,450 403,600 420 S900 462,1100 501 L1550 598" stroke-width="30" filter="url(#b2)"/>
        </g>
      </svg>
      <svg viewBox="0 0 1672 941" preserveAspectRatio="none">
        <defs>
          <linearGradient id="mt" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#9ec4ff" stop-opacity="0"/><stop offset=".55" stop-color="#c9ddff" stop-opacity=".28"/><stop offset=".9" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
          </linearGradient>
          <filter id="mb1" x="-10%" y="-400%" width="120%" height="900%"><feGaussianBlur stdDeviation="1.1"/></filter>
          <filter id="mb5" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
          <mask id="occm" maskUnits="userSpaceOnUse" x="0" y="0" width="1672" height="941">
            <image href="occ.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="none"/>
          </mask>
        </defs>
        <g mask="url(#occm)">
          <g id="met" style="opacity:0">
            <path d="M0 0 L300 -2.6 Q304 0 300 2.6 Z" fill="url(#mt)" filter="url(#mb1)"/>
            <path d="M150 0 L300 -1 L300 1 Z" fill="url(#mt)"/>
            <circle cx="300" cy="0" r="9" fill="#d6e6ff" opacity=".5" filter="url(#mb5)"/>
            <circle cx="300" cy="0" r="2" fill="#fff" filter="url(#mb1)"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="night" id="night"></div>
    <div class="copy">
      <p>Vickey Lu — product designer, AI and platform systems</p>
      <h1 id="hero-heading"><span>See systems</span><span>Understand people</span><span>Ship clarity</span></h1>
    </div>
  </main>
  <script>
    (function () {
      var IW = 1672, IH = 941, FIG_X = 843;
      var wrap = document.getElementById('wrap');
      var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Frame the 16:9 scene so it always covers the viewport, with Vickey at 74% across on desktop
      function layout() {
        var vw = innerWidth, vh = innerHeight;
        var mobile = vw < 760 && vh > vw;
        var ww = Math.max(mobile ? 0 : 1.52 * vw, vh * IW / IH * (mobile ? 1.4 : 1), vw);
        var wh = ww * IH / IW;
        var left = (mobile ? 0.66 : 0.74) * vw - FIG_X / IW * ww;
        var top = mobile ? 0.42 * vh - 260 / IH * wh : vh / 2 - 459.5 / IH * wh;
        left = Math.min(0, Math.max(vw - ww, left));
        top = Math.min(0, Math.max(vh - wh, top));
        wrap.style.cssText = 'width:' + ww + 'px;height:' + wh + 'px;left:' + left + 'px;top:' + top + 'px';
      }
      addEventListener('resize', layout); layout();

      var vid = document.getElementById('vid'), fx = document.getElementById('fx'), night = document.getElementById('night');
      if (reduce) { vid.removeAttribute('autoplay'); vid.pause(); night.classList.add('static'); return; }
      fx.classList.add('play'); night.classList.add('play');

      // Some browsers skip the autoplay attribute; start it explicitly once it can play
      function kick() { if (vid.paused) { var p = vid.play(); if (p && p.catch) p.catch(function () {}); } }
      vid.addEventListener('canplay', kick);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) kick(); });
      kick();

      // Occasional meteor, passing behind her toward the left horizon
      var met = document.getElementById('met');
      function shoot() {
        var x = 1170 + Math.random() * 30, y = 266 + Math.random() * 16, dur = 1400, dist = 740,
            deg = 161 + Math.random() * 2, a = deg * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a), s = performance.now();
        (function f(t) {
          var p = Math.min((t - s) / dur, 1), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
          met.setAttribute('transform', 'translate(' + (x + dx * dist * e).toFixed(1) + ' ' + (y + dy * dist * e).toFixed(1) + ') rotate(' + deg.toFixed(1) + ') scale(.38)');
          met.style.opacity = .7 * (p < .15 ? p / .15 : p > .6 ? Math.max(0, (1 - p) / .4) : 1);
          if (p < 1) requestAnimationFrame(f); else met.style.opacity = 0;
        })(s);
      }
      function sched() { setTimeout(function () { if (!document.hidden) shoot(); sched(); }, 12000 + Math.random() * 8000); }
      setTimeout(function () { shoot(); sched(); }, 4500);
    })();
  </script>
</body>
</html>
